name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: Web Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

  server-check:
    name: Server Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint server
        run: npm run lint --workspaces --if-present

      - name: Boot check
        run: |
          node -e "require('dotenv').config({ path: '.env.example' }); require('./apps/server/app.js'); console.log('Server module loaded OK');"
        env:
          NODE_ENV: production
          PORT: 3300
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: mg_drive_ci
          DB_USERNAME: root
          DB_PASSWORD: ""
          JWT_SECRET: dummy_jwt_secret_for_ci_only_32chars
          CSRF_SECRET: dummy_csrf_secret_for_ci_only_32chars
          REDIS_URL: redis://127.0.0.1:6379
          DB_SYNC_ALTER: "false"

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: web-quality
    defaults:
      run:
        working-directory: apps/web
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mg_drive_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Sync schema and seed E2E user
        run: node ../../apps/server/scripts/seed-e2e.js
        env:
          CI: "true"
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: mg_drive_e2e
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_SYNC_ALTER: "true"
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: dummy_jwt_secret_for_ci_only_32chars
          CSRF_SECRET: dummy_csrf_secret_for_ci_only_32chars
          E2E_TEST_USER_EMAIL: e2e@test.local
          E2E_TEST_USER_PASSWORD: TestPassword123!

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          CI: "true"
          NODE_ENV: test
          PORT: 3300
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: mg_drive_e2e
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_SYNC_ALTER: "false"
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: dummy_jwt_secret_for_ci_only_32chars
          CSRF_SECRET: dummy_csrf_secret_for_ci_only_32chars
          API_URL: http://localhost:3300
          E2E_TEST_USER_EMAIL: e2e@test.local
          E2E_TEST_USER_PASSWORD: TestPassword123!

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7