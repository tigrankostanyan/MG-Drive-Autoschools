<!doctype html>
<html lang="hy">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Օֆլայն — MG Drive</title>
    <style>
      body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:system-ui,sans-serif;background:#fff;color:#0f172a;text-align:center;padding:24px}
      img{width:180px}
      button{background:#044dda;color:#fff;border:0;border-radius:12px;padding:12px 24px;font-size:16px;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <img src="/images/logo/logo.png" alt="MG Drive" />
    <h1>Ինտերնետ կապ չկա</h1>
    <p>Ստուգեք կապը և փորձեք կրկին։</p>
    <button type="button" id="reload-btn">Թարմացնել</button>
    <script>
      document.getElementById('reload-btn').addEventListener('click', () => {
        location.reload();
      });
    </script>
  </body>
</html>
